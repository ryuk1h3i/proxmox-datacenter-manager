name: Build and publish container image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  # Republishes the image with the current Debian security updates. This is the
  # only way a deployed container gets base system fixes.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  packages:
    name: Build ${{ matrix.component }} packages
    runs-on: ubuntu-latest

    strategy:
      # Let the sibling finish and export its cache even if one component fails.
      fail-fast: false
      matrix:
        component: [api, ui]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.component }} packages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.component }}-packages
          outputs: type=local,dest=packages
          provenance: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Upload ${{ matrix.component }} packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.component }}
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 1

  container:
    name: Build container
    runs-on: ubuntu-latest
    needs: packages

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Collect image metadata inputs
        id: build-info
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule,pattern=rebuild-{{date 'YYYYMMDD'}}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'schedule' }}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runtime
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            PDM_IMAGE_REPOSITORY=${{ env.IMAGE_NAME }}
            PDM_IMAGE_REVISION=${{ github.sha }}
            PDM_IMAGE_CREATED=${{ steps.build-info.outputs.created }}
          # A scheduled run exists to pick up new base packages, so it must not
          # reuse the layer that installed the old ones.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
